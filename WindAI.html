<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wind.AI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000;
            overflow: hidden;
            height: 100vh;
            position: relative;
        }

        /* Background lines container */
        #background-lines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* Liquid glass container */
        #container {
            position: relative;
            z-index: 2;
            max-width: 800px;
            margin: 0 auto;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 1rem;
        }

        header h1 {
            color: #fff;
            font-size: 1.8rem;
            background: linear-gradient(to right, #4facfe, #00f2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
        }

        
        header h1 {
            color: #fff;
            font-size: 1.8rem;
            background: linear-gradient(to right, #4facfe, #00f2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        
        /* Chat messages */
        #chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            margin: 0 1rem 1rem 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .message {
            max-width: 80%;
            padding: 0.75rem 1rem;
            border-radius: 18px;
            margin-bottom: 0.5rem;
            animation: fadeIn 0.3s ease;
        }

        .user-message {
            background: linear-gradient(to right, #4facfe, #00f2fe);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 5px;
        }

        .ai-message {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 18px;
            color: #fff;
            align-self: flex-start;
            border-bottom-left-radius: 5px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Input area */
        #input-area {
            display: flex;
            gap: 0.5rem;
            padding: 1rem;
            margin: 0 1rem 1rem 1rem;
        }

        #user-input {
            flex: 1;
            padding: 0.75rem 1rem;
            border: none;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            color: #fff;
            font-size: 1rem;
            outline: none;
        }

        #user-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        #send-btn {
            background: linear-gradient(to right, #4facfe, #00f2fe);
            border: none;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #send-btn:hover {
            transform: scale(1.1);
        }

        #send-btn svg {
            width: 24px;
            height: 24px;
            fill: #fff;
        }

        
        .settings-content {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 2rem;
            width: 90%;
            max-width: 500px;
            color: #fff;
        }

        .settings-content h2 {
            text-align: center;
            margin-bottom: 1.5rem;
            background: linear-gradient(to right, #4facfe, #00f2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .provider-form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .provider-form label {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            font-size: 0.9rem;
        }

        .provider-form input {
            padding: 0.75rem;
            border: none;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            color: #fff;
            font-size: 1rem;
            outline: none;
        }

        .provider-form input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .provider-actions {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
            margin-top: 1.5rem;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(to right, #4facfe, #00f2fe);
            color: white;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .providers-list {
            margin-top: 1.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 1rem;
        }

        .provider-item {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 1rem;
            margin-bottom: 0.75rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .provider-info h3 {
            margin-bottom: 0.25rem;
        }

        .provider-details {
            font-size: 0.85rem;
            opacity: 0.8;
        }

        .delete-btn {
            background: rgba(255, 0, 0, 0.2);
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .delete-btn:hover {
            background: rgba(255, 0, 0, 0.3);
        }

        /* Responsive */
        @media (max-width: 600px) {
            header h1 {
                font-size: 1.5rem;
            }

            #chat-messages {
                margin: 0 0.5rem 0.5rem 0.5rem;
            }

            #input-area {
                margin: 0 0.5rem 0.5rem 0.5rem;
            }
        }
    </style>
</head>
<body>
    <div id="background-lines"></div>
    <div id="container">
        <header>
            <h1>Wind.AI</h1>
        </header>

        
        <div id="chat-messages">
            <!-- Messages will be inserted here -->
        </div>
        <div id="input-area">
            <input type="text" id="user-input" placeholder="Type your message...">
            <button id="send-btn">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                </svg>
            </button>
        </div>
    </div>

    
    <script>
        // Background lines animation
        const backgroundLines = document.getElementById('background-lines');
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        backgroundLines.appendChild(canvas);

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Lines properties
        const lines = [];
        const lineCount = 50;
        const maxLength = 200;
        const minLength = 50;
        const maxWidth = 3;
        const minWidth = 1;
        const speed = 0.5;

        // Initialize lines
        for (let i = 0; i < lineCount; i++) {
            lines.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                length: Math.random() * (maxLength - minLength) + minLength,
                width: Math.random() * (maxWidth - minWidth) + minWidth,
                speed: Math.random() * speed + 0.1
            });
        }

        // Mouse position for reveal effect
        const mouse = { x: 0, y: 0 };
        const revealRadius = 150;

        // Update mouse position
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        // Animation loop
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw black background
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Update and draw lines (draw all lines everywhere)
            lines.forEach(line => {
                // Move line left
                line.x -= line.speed;

                // Reset line if it goes off screen
                if (line.x < -line.length) {
                    line.x = canvas.width + Math.random() * 100;
                    line.y = Math.random() * canvas.height;
                    line.length = Math.random() * (maxLength - minLength) + minLength;
                    line.width = Math.random() * (maxWidth - minWidth) + minWidth;
                    line.speed = Math.random() * speed + 0.1;
                }

                // Draw line
                ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
                ctx.fillRect(line.x, line.y, line.length, line.width);
            });

            requestAnimationFrame(animate);
        }

        animate();

        // Chat functionality
        const chatMessages = document.getElementById('chat-messages');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        // Add welcome message
        addMessage('Hello! I am Wind.AI. How can I assist you today?', 'ai');

        // Send message on button click
        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        async function sendMessage() {
            const message = userInput.value.trim();
            if (message === '') return;

            // Add user message
            addMessage(message, 'user');
            userInput.value = '';

            // Hardcoded provider configuration - edit these values directly
            const API_KEY = "PUT_HERE_API"; // Your API key (for Anthropic: sk-ant-..., for OpenAI: sk-...)
            const BASE_URL = "PUT_HERE_BASE_URL"; // API base URL
            const MODEL = "PUT_HERE_MODEL"; // Model to use
            const PROVIDER_TYPE = "anthropic"; // "anthropic" for Claude, "openai" for OpenAI-compatible

            if (!API_KEY || !BASE_URL || !MODEL) {
                addMessage("Please configure your API settings in the code: set API_KEY, BASE_URL, and MODEL values.", 'ai');
                return;
            }

            try {
                let aiMessage = '';

                if (PROVIDER_TYPE === 'anthropic') {
                    // Call Anthropic Claude API
                    const base = BASE_URL.endsWith('/') ? BASE_URL : BASE_URL + '/';
                    const endpoint = base + 'v1/messages';

                    const response = await fetch(endpoint, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'x-api-key': API_KEY,
                            'anthropic-version': '2023-06-01'
                        },
                        body: JSON.stringify({
                            model: MODEL,
                            max_tokens: 150,
                            messages: [{ role: 'user', content: message }]
                        })
                    });

                    if (!response.ok) {
                        throw new Error(`API error: ${response.status} ${response.statusText}`);
                    }

                    const data = await response.json();
                    if (data.content && data.content.length > 0) {
                        aiMessage = data.content[0].text || 'No response from AI';
                    } else {
                        aiMessage = 'Unexpected response format';
                    }
                } else {
                    // Call OpenAI-compatible API (default)
                    const base = BASE_URL.endsWith('/') ? BASE_URL : BASE_URL + '/';
                    const endpoint = base + 'chat/completions';

                    const response = await fetch(endpoint, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${API_KEY}`
                        },
                        body: JSON.stringify({
                            model: MODEL,
                            messages: [{ role: 'user', content: message }],
                            temperature: 0.7,
                            max_tokens: 150
                        })
                    });

                    if (!response.ok) {
                        throw new Error(`API error: ${response.status} ${response.statusText}`);
                    }

                    const data = await response.json();
                    if (data.choices && data.choices.length > 0) {
                        aiMessage = data.choices[0].message?.content || 'No response from AI';
                    } else {
                        aiMessage = 'Unexpected response format';
                    }
                }

                addMessage(aiMessage, 'ai');
            } catch (error) {
                console.error('Error calling AI provider:', error);
                let userMessage = `Sorry, I encountered an error: ${error.message}. Please check your provider settings and network connection.`;
                if (error instanceof TypeError && error.message === 'Failed to fetch') {
                    userMessage += ' This is likely due to CORS (Cross-Origin Resource Sharing) restrictions when calling the API directly from the browser. ';
                    userMessage += 'Solutions: ';
                    userMessage += '1) Use an OpenAI-compatible API that supports CORS (like local LLMs via LM Studio, Ollama, etc.)';
                    userMessage += '2) Serve this HTML through a local development server with proxy capabilities';
                    userMessage += '3) For Anthropic Claude, consider using their official SDK or a backend proxy';
                } else if (error.message.startsWith('API error: 413')) {
                    userMessage = 'Error: Your message is too large. Please shorten your input and try again.';
                } else if (error.message.startsWith('API error:')) {
                    // Extract status code for more specific guidance
                    userMessage = `API error: ${error.message.substring(10)}. Please check your API key, model name, and provider settings.`;
                }
                addMessage(userMessage, 'ai');
            }
        }

        function addMessage(content, type) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message');
            messageDiv.classList.add(type === 'user' ? 'user-message' : 'ai-message');
            messageDiv.textContent = content;
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

            </script>
</body>
</html>
