<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MurzyBrowser</title>

    <!-- Browser tab icon -->
    <link rel="icon" type="image/x-icon" href="/MurzyBrowser.ico">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;

            /* Animated rainbow background */
            background: linear-gradient(
                45deg,
                #ff0000,
                #ff8800,
                #ffee00,
                #00ff00,
                #00ffff,
                #0066ff,
                #8800ff,
                #ff0088
            );
            background-size: 400% 400%;
            animation: rainbow 12s ease infinite;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        @keyframes rainbow {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .card {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(20px);
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            text-align: center;
            width: min(800px, 90vw);
        }

        .header {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .logo {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            object-fit: contain;
            filter:
                drop-shadow(0 0 12px #00ff00)
                drop-shadow(0 0 30px #00ff00);
        }

        .title {
            color: white;
            font-size: 48px;
            font-weight: 900;
            text-shadow: 0 0 15px rgba(255,255,255,0.8);
        }

        .search-box {
            display: flex;
            align-items: center;
            background: white;
            border-radius: 999px;
            padding: 15px 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        .google-icon {
            width: 24px;
            height: 24px;
            margin-right: 12px;
        }

        input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 18px;
            background: transparent;
        }

        input::placeholder {
            color: #666;
        }

        .footer {
            margin-top: 15px;
            color: white;
            opacity: 0.9;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="card">

        <div class="header">
            <!-- Your ICO file -->
            <img src="MurzyBrowser.ico" class="logo" alt="MurzyBrowser Icon">

            <div class="title">
                <b>MurzyBrowser</b>
            </div>
        </div>

        <form id="searchForm">
            <div class="search-box">

                <!-- Google favicon -->
                <img
                    class="google-icon"
                    src="https://www.google.com/favicon.ico"
                    alt="Google">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search in Google"
                    autocomplete="off">
            </div>
        </form>

        <div class="footer">
            Search the web with Google
        </div>

    </div>

    <script>
        document.getElementById("searchForm").addEventListener("submit", function(e) {
            e.preventDefault();

            const query = document
                .getElementById("searchInput")
                .value
                .trim();

            if (query) {
                window.location.href =
                    "https://google.com/search?q=" +
                    encodeURIComponent(query);
            }
        });

        // Focus search box automatically
        document.getElementById("searchInput").focus();
    </script>

</body>
</html>
